version: '3.8'

services:
  # -----------------------------
  # PostgreSQL - 结构化数据存储
  # -----------------------------
  postgres:
    image: postgres:15-alpine
    container_name: brandpulse-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-brandpulse}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-brandpulse123}
      POSTGRES_DB: ${POSTGRES_DB:-brandpulse}
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - ./data/postgres:/var/lib/postgresql/data
      - ./init-scripts:/docker-entrypoint-initdb.d
    networks:
      - brandpulse-network
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-brandpulse} -d ${POSTGRES_DB:-brandpulse}"]
      interval: 10s
      timeout: 5s
      retries: 5

  # -----------------------------
  # Neo4j - 图数据库（品牌关系网络）
  # -----------------------------
  neo4j:
    image: neo4j:5-community
    container_name: brandpulse-neo4j
    restart: unless-stopped
    environment:
      NEO4J_AUTH: ${NEO4J_AUTH:-neo4j/brandpulse123}
      NEO4J_PLUGINS: '["apoc"]'  # APOC 插件，用于数据导入和图算法
      NEO4J_dbms_memory_heap_initial__size: 512m
      NEO4J_dbms_memory_heap_max__size: 1G
      NEO4J_dbms_connector_http_advertised__address: ${HOST_IP:-localhost}:${NEO4J_HTTP_PORT:-8484}
      NEO4J_dbms_connector_bolt_advertised__address: ${HOST_IP:-localhost}:${NEO4J_BOLT_PORT:-8585}
    ports:
      - "${NEO4J_HTTP_PORT:-8484}:7474"    # Neo4j Browser
      - "${NEO4J_BOLT_PORT:-8585}:7687"    # Bolt 协议
    volumes:
      - ./data/neo4j/data:/data
      - ./data/neo4j/logs:/logs
      - ./data/neo4j/import:/var/lib/neo4j/import
      - ./data/neo4j/plugins:/plugins
    networks:
      - brandpulse-network
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://localhost:7474"]
      interval: 10s
      timeout: 5s
      retries: 10

  # -----------------------------
  # Qdrant - 向量数据库（RAG 知识库）
  # -----------------------------
  qdrant:
    image: qdrant/qdrant:latest
    container_name: brandpulse-qdrant
    restart: unless-stopped
    ports:
      - "${QDRANT_HTTP_PORT:-7333}:6333"    # HTTP API
      - "${QDRANT_GRPC_PORT:-7334}:6334"    # gRPC API
    volumes:
      - ./data/qdrant:/qdrant/storage
    networks:
      - brandpulse-network
    healthcheck:
      test: ["CMD-SHELL", "curl -f http://localhost:6333/healthz || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 5

networks:
  brandpulse-network:
    driver: bridge
